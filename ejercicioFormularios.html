<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Agencia Viajes - Estilo Simple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            background-color: #f9f9f9;
        }

        form {
            border: 1px solid red;
            padding: 40px;
            width: 600px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h2 {
            color: red;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: left;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 20px;
            align-items: start;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            padding-top: 8px;
            display: block;
        }

        .label-checkbox {
            font-weight: normal;
            padding-top: 0;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            height: 80px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .terminos-contenedor {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        .terminos-contenedor label {
            padding-top: 0;
            font-size: 12px;
            font-weight: normal;
        }

        .botones-contenedor {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 20px;
        }
        button {
            padding: 5px 15px;
            margin: 0 5px;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #aaa;
        }
        button[type="submit"] {
            background-color: #e0e0e0;
        }

        .checkbox-linea {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <form action="#" method="POST">
        <h2>RESERVA AGENCIA VIAJES :</h2>

        <div class="form-grid">
            <label for="ciudad-destino">DESTINO *</label>
            <select name="Ciudad" id="ciudad-destino" required>
                <option value="" selected disabled>Seleccionar ciudad</option>
                <option value="granada">Granada</option>
                <option value="sevilla">Sevilla</option>
                <option value="huelva">Huelva</option>
                <option value="murcia">Murcia</option>
            </select>

            <label for="fecha">FECHA DE SALIDA</label>
            <div>
                <input type="date" id="fecha" name="fecha" placeholder="dd/mm/aaaa">
                <div class="checkbox-linea">
                    <input type="checkbox" id="flexible" name="flexible">
                    <label for="flexible" class="label-checkbox">Soy flexible con la fecha</label>
                </div>
            </div>

            <label for="NumAdultos">NÚMERO DE ADULTOS *</label>
            <div>
                <select name="NumAdultos" id="NumAdultos" required>
                    <option value="" selected disabled>Seleccionar adultos</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
                <div class="checkbox-linea">
                    <input type="checkbox" id="ninos" name="ninos">
                    <label for="ninos" class="label-checkbox">Viajamos con niños</label>
                </div>
            </div>

            <label>EDAD ADULTOS</label>
            <div class="checkbox-linea checkbox-group">
                <div><input type="checkbox" id="e1" name="edad[]" value="18-30"><label for="e1" class="label-checkbox">18-30</label></div>
                <div><input type="checkbox" id="e2" name="edad[]" value="31-50"><label for="e2" class="label-checkbox">31-50</label></div>
                <div><input type="checkbox" id="e3" name="edad[]" value="50+"><label for="e3" class="label-checkbox">50+</label></div>
            </div>

            <label>TIPO DE VIAJE</label>
            <div class="checkbox-linea">
                <input type="checkbox" name="viaje" id="viaje-programado" value="programado">
                <label for="viaje-programado" class="label-checkbox">Viaje programado</label>
            </div>

            <label>ACTIVIDADES</label>
            <div class="checkbox-group">
                <div><input type="checkbox" id="act1" name="actividades[]" value="galapagos"><label for="act1" class="label-checkbox">Cruceros en galápagos</label></div>
                <div><input type="checkbox" id="act2" name="actividades[]" value="hotel-yate"><label for="act2" class="label-checkbox">Tours combinados, hotel-yate</label></div>
                <div><input type="checkbox" id="act3" name="actividades[]" value="empaquetados"><label for="act3" class="label-checkbox">Tours empaquetados</label></div>
            </div>

            <label>TIPO DE ACOMODACIÓN *</label>
            <div class="checkbox-group">
                <div><input type="radio" id="acc1" name="acomodacion" value="5" required><label for="acc1" class="label-checkbox">5 estrellas</label></div>
                <div><input type="radio" id="acc2" name="acomodacion" value="4"><label for="acc2" class="label-checkbox">4 estrellas</label></div>
                <div><input type="radio" id="acc3" name="acomodacion" value="3"><label for="acc3" class="label-checkbox">3 estrellas</label></div>
            </div>

            <label>OTROS SERVICIOS</label>
            <div class="checkbox-group">
                <div><input type="checkbox" id="serv1" name="servicios[]" value="guias"><label for="serv1" class="label-checkbox">Actividades, guías, información</label></div>
                <div><input type="checkbox" id="serv2" name="servicios[]" value="transporte"><label for="serv2" class="label-checkbox">Transporte</label></div>
            </div>

            <label for="deseo-viaje" style="align-self: start;">¿CUÁL ES EL VIAJE QUE QUICIERAS?</label>
            <textarea id="deseo-viaje" name="deseo_viaje"></textarea>

            <label for="nombre">NOMBRE Y APELLIDO *</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">EMAIL *</label>
            <input type="email" id="email" name="email" required>

            <label for="telf">TELÉFONO</label>
            <input type="tel" id="telf" name="telefono">

            <label for="ciudad-residencia">CIUDAD</label>
            <input type="text" id="ciudad-residencia" name="ciudad_residencia">

            <label for="pais">PAIS DE RESIDENCIA</label>
            <input type="text" id="pais" name="pais">

            <div class="terminos-contenedor">
                <input type="checkbox" id="ok" name="terminos" required>
                <label for="ok">Estoy de acuerdo con los Términos de uso y políticas de privacidad *</label>
            </div>

            <div class="botones-contenedor">
                <button type="reset">Limpiar</button>
                <button type="submit">Enviar</button>
            </div>
        </div>
    </form>
</body>
</html>
