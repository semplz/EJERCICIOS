<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Datos personales</title></head>
<body>
    <h1>Datos personales</h1>
    <form action="porcesarDatos.php" method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="20" required>
        <br>
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos" maxlength="20" required>

        <!-- TODO: crea un select name="edad" con los cuatro intervalos del enunciado. -->
         <br>
         <label for="edad">Edad</label>
         <select name="edad" id="edad">
            <option value="0-20">0-20</option>
            <option value="21-39">21-39</option>
            <option value="40-59">40-59</option>
            <option value="60+">60+</option>
        </select>
        
        <!-- TODO: crea el campo numérico name="peso" que admita decimales. -->
         <br>
         <label for="peso">Peso</label>
        <input type="number" id="peso" name="peso" min="20" max="500">
        <!-- TODO: crea los radios name="sexo" (masculino/femenino). -->
         <br>
         <p>Elige el genero: </p>
         <label for="masculino">Masculino</label>
        <input type="radio" id="masculino" value="masculino" name="genero">
        <label for="femenino">Femenino</label>
        <input type="radio" id="femenino" value="femenino" name="genero">
        <!-- TODO: crea los radios name="estado-civil" (soltero/casado/otro). -->
         <br>
         <p>Elige estado civil: </p>
         <label for="soltero">Soltero</label>
         <input type="radio" id="soltero" value="soltero" name="estadoCivil">
         <label for="casado">Casado</label>
         <input type="radio" id="casado" value="casado" name="estadoCivil">
         <label for="otro">Otro</label>
         <input type="radio" id="otro" value="otro" name="estadoCivil">
        <!-- TODO: crea los checkboxes name="aficiones[]" con los valores pedidos. -->
         <br>
         <label for="aficiones">Aficiones: </label><br>
         cine
         <input type="checkbox" value="cine" name="aficiones"><br>
         literatura
         <input type="checkbox" value="literatura" name="aficiones"><br>
         tebeos
         <input type="checkbox" value="tebeos" name="aficiones"><br>
         deporte
         <input type="checkbox" value="deporte" name="aficiones"><br>
         musica
         <input type="checkbox" value="musica" name="aficiones"><br>
         television
         <input type="checkbox" value="television" name="aficiones"><br>
        <!-- TODO: añade los botones Enviar y Borrar. -->

        <button type="submit">Enviar</button>
        <button type="reset">Borrar</button>
    </form>
</body>
</html>
